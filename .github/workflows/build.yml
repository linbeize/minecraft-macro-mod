name: Build Mod

on:
  pull_request:
  push:
    branches:
      - codex/update-minecraft-26-1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build with Java 25
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-macro-mod-jars
          path: build/libs/*.jar
          if-no-files-found: warn
